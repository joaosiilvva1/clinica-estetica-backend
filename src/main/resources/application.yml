spring:
  application:
    name: estetica

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/estetica_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

jwt:
  secret: ${JWT_SECRET:minhaChaveSecretaSuperSeguraParaTesteComMaisDeTrintaEDoisCaracteres123}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

business:
  opening-hour: ${BUSINESS_OPENING_HOUR:9}
  closing-hour: ${BUSINESS_CLOSING_HOUR:18}
  zone-id: America/Sao_Paulo
  slot-granularity-minutes: 30

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
# Gemini API (GEMINI_API_KEY já configurada no Render; nunca exponha a chave no frontend)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.7-flash}
  image-model: ${GEMINI_IMAGE_MODEL:gemini-3.1-flash-image}
